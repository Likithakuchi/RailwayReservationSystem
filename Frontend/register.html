<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Passenger - RailVibe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header></header>

    <main class="auth-wrapper" style="padding: 1.5rem 1rem;">
        <div class="glass-card auth-card" style="max-width: 550px;">
            <div class="auth-header">
                <h2>Passenger Registration</h2>
                <p>Register to manage bookings, track schedules, and confirm seat tickets.</p>
            </div>
            
            <form id="register-form">
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" class="form-control" placeholder="e.g. Rahul Sharma" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="e.g. rahul@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" class="form-control" placeholder="e.g. 9876543210" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" class="form-control">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" class="form-control" placeholder="e.g. 28" min="1" max="120" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="address">Address / City</label>
                    <input type="text" id="address" class="form-control" placeholder="e.g. Hyderabad" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
            </form>
            
            <div class="auth-footer">
                Already registered? <a href="login.html">Login here</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 RailVibe Reservation System. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
