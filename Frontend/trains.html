<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Trains - RailVibe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header></header>

    <main class="container">
        <h2 class="section-title">Train Routes & Schedules</h2>
        <p class="section-subtitle">Search direct timetables, check seat remaining counts, and book coach fares.</p>

        <div class="trains-layout">
            
            <!-- Left Filter Card -->
            <div class="glass-card">
                <h3 style="margin-bottom: 1.25rem;">Adjust Route</h3>
                
                <div class="form-group">
                    <label for="source-input">From (Source)</label>
                    <input type="text" id="source-input" class="form-control" placeholder="e.g. Chennai" required>
                </div>
                
                <div class="form-group">
                    <label for="dest-input">To (Destination)</label>
                    <input type="text" id="dest-input" class="form-control" placeholder="e.g. Bangalore" required>
                </div>
                
                <div class="form-group">
                    <label for="date-input">Journey Date</label>
                    <input type="date" id="date-input" class="form-control" required>
                </div>
                
                <button type="button" id="search-trains-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Update Search 🔍</button>
            </div>

            <!-- Right Results list -->
            <div class="train-list" id="trains-list-results">
                <!-- Loaded dynamically by script.js -->
                <div class="glass-card" style="text-align: center; padding: 4rem;">
                    <h3>Find Your Journey</h3>
                    <p style="color:var(--text-secondary); margin-top: 0.5rem;">Use the left panel to search routes and display train timetables.</p>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 RailVibe Reservation System. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
