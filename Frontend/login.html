<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RailVibe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header></header>

    <main class="auth-wrapper">
        <div class="glass-card auth-card">
            <div class="auth-header">
                <h2>Account Login</h2>
                <p>Welcome back! Select your role and enter credentials.</p>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="role">Login Role</label>
                    <select id="role" class="form-control">
                        <option value="passenger">Passenger</option>
                        <option value="admin">Railway Administrator</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="e.g. rahul@gmail.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login Securely</button>
            </form>
            
            <div class="auth-footer">
                Don't have a passenger account? <a href="register.html">Register Now</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 RailVibe Reservation System. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
